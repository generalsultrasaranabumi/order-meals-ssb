<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Order Meals PT SSB</title>
<style>
:root{--navy:#1F3864;--bg:#f3f5f9;--card:#fff;--line:#d9dee8;--mut:#667085;--ok:#137333;--bad:#b3261e;--warn:#fff4ce}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1c2333}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0}
header small{opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.wrap{max-width:720px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,button{font:inherit}
input[type=text],input[type=date],input[type=password],input[type=number],select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}
button{border:0;border-radius:9px;padding:11px 14px;background:var(--navy);color:#fff;font-weight:600}
button.sec{background:#e8ecf4;color:var(--navy)}
button:disabled{opacity:.5}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{background:#e8ecf4;color:var(--navy);white-space:nowrap}
.tab.on{background:var(--navy);color:#fff}
#cutoff{font-size:13px;color:var(--mut);margin:4px 0 8px}
.line{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.line.extra{border-style:dashed}
.lt{display:flex;flex-direction:column;gap:2px;position:relative;padding-right:28px;margin-bottom:8px}
.lt span{font-size:12px;color:var(--mut)}
.x{position:absolute;right:0;top:0;background:#fde7e5;color:var(--bad);padding:4px 10px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qs label{font-size:12px;color:var(--mut)}
.qs input{font-size:18px;text-align:center}
.note{margin-top:8px;font-size:13px}
.muted{color:var(--mut);font-size:13px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
#bar .in{max-width:720px;margin:0 auto}
#tot{font-size:13px;margin-bottom:8px}
#banner{background:var(--warn);padding:8px 12px;font-size:13px;display:none}
#toast{position:fixed;left:12px;right:12px;bottom:calc(120px + env(safe-area-inset-bottom,0px));background:#202939;color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;display:none;z-index:9;white-space:pre-line}
.err{color:var(--bad);font-size:14px;margin-top:8px;white-space:pre-line}
.hide{display:none!important}
</style>
</head>
<body>

<section id="login" class="wrap" style="padding-top:40px">
  <div class="card">
    <h2 style="margin:0 0 4px;color:var(--navy)">Order Meals PT SSB</h2>
    <p class="muted" style="margin:0 0 12px">Masukkan PIN departemen dari GA.</p>
    <label class="f" for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button id="btnLogin" style="width:100%;margin-top:12px">Masuk</button>
  </div>
</section>

<section id="app" class="hide">
  <header>
    <div class="row"><div style="flex:1"><h1 id="who"></h1><small>Order Meals PT SSB</small></div>
    <button class="sec" id="btnOut" style="padding:7px 10px">Keluar</button></div>
  </header>
  <div id="banner"></div>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div style="flex:1"><label class="f" for="tgl">Tanggal makan</label><input id="tgl" type="date"></div>
        <div style="flex:1"><label class="f" for="nama">Nama pemesan</label><input id="nama" type="text" maxlength="60"></div>
      </div>
    </div>
    <div id="tabs"></div>
    <div id="cutoff"></div>
    <div class="row" style="margin-bottom:8px">
      <button class="sec" id="btnLast" style="flex:1">Salin pesanan terakhir</button>
      <button class="sec" id="btnClear" style="flex:1">Kosongkan angka</button>
    </div>
    <div id="lines"></div>
    <div class="card" id="addBox">
      <b style="font-size:14px">+ Titik lain</b>
      <label class="f" for="addTitik" style="margin-top:8px">Titik pengantaran</label>
      <select id="addTitik"></select>
      <label class="f" for="addPer" style="margin-top:8px">Peruntukan</label>
      <input id="addPer" type="text" maxlength="100" placeholder="Contoh: Tim Workshop">
      <button class="sec" id="btnAdd" style="margin-top:10px;width:100%">Tambahkan</button>
    </div>
  </div>
  <div id="bar"><div class="in">
    <div id="tot"></div>
    <button id="btnSend" style="width:100%">Kirim pesanan</button>
  </div></div>
</section>
<div id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwvZHJ5FW34AtseIhcsEqmKEWaLM6L6dg1PCMTXT21v03oi6vUVJN2LgSJjNLL2QgozGg/exec";   // contoh: https://script.google.com/macros/s/XXXX/exec

const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const num = v => { const n = parseInt(v, 10); return isFinite(n) && n > 0 ? n : 0; };

let S = { pin:null, meta:null, tanggal:null, periode:null, orders:{}, offlineLoad:false };

async function call(body){
  let res;
  try{
    res = await fetch(API_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(body) });
  }catch(e){ const er = new Error("Tidak ada koneksi."); er.net = true; throw er; }
  let data;
  try{ data = await res.json(); }
  catch(e){ throw new Error("Respons server tidak valid. Periksa URL API dan izin deployment."); }
  if(!data.ok){ throw new Error(data.error || "Terjadi kesalahan."); }
  return data;
}

let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = "none"; }, 4500);
}

/* ---------- Login ---------- */
async function login(pin, silent){
  try{
    const m = await call({ action:"login", pin });
    S.pin = pin; S.meta = m; LS.set("om_pin", pin); LS.set("om_meta", m);
    return true;
  }catch(e){
    if(e.net){
      const m = LS.get("om_meta", null);
      if(m && LS.get("om_pin", null) === pin){ S.pin = pin; S.meta = m; return true; }
    }
    if(!silent) $("#loginErr").textContent = e.message;
    if(e.message === "PIN salah."){ LS.del("om_pin"); LS.del("om_meta"); }
    return false;
  }
}

async function enterApp(){
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#who").textContent = S.meta.departemen;
  $("#nama").value = LS.get("om_nama", "");
  const t = new Date(); t.setDate(t.getDate() + 1);
  $("#tgl").value = ymd(t); $("#tgl").min = ymd(new Date());
  S.tanggal = $("#tgl").value;
  S.periode = S.meta.periode[0];
  buildAddSelect();
  await loadDate();
  flushQueue();
}

function buildAddSelect(){
  const groups = {};
  S.meta.titik.forEach(t => { (groups[t.area || "Lainnya"] = groups[t.area || "Lainnya"] || []).push(t.titik); });
  $("#addTitik").innerHTML = Object.keys(groups).sort().map(a =>
    `<optgroup label="${esc(a)}">${groups[a].map(t => `<option>${esc(t)}</option>`).join("")}</optgroup>`).join("");
}

/* ---------- Data pesanan ---------- */
function buildLines(saved){
  const used = new Set();
  const lines = S.meta.langganan.map(s => ({ titik:s.titik, peruntukan:s.peruntukan, packmeal:0, canteen:0, catatan:"", sub:true }));
  saved.forEach(sv => {
    const i = lines.findIndex((l, idx) => l.sub && !used.has(idx) && l.titik === sv.titik && l.peruntukan === sv.peruntukan);
    if(i >= 0){ used.add(i); Object.assign(lines[i], { packmeal:sv.packmeal, canteen:sv.canteen, catatan:sv.catatan || "" }); }
    else lines.push({ titik:sv.titik, peruntukan:sv.peruntukan, packmeal:sv.packmeal, canteen:sv.canteen, catatan:sv.catatan || "", sub:false });
  });
  return lines;
}

async function loadDate(){
  S.orders = {};
  let server = null;
  try{ server = await call({ action:"load", pin:S.pin, tanggal:S.tanggal }); S.offlineLoad = false; }
  catch(e){ S.offlineLoad = true; if(!e.net) toast(e.message); }
  S.meta.periode.forEach(p => {
    const o = server && server.orders[p];
    S.orders[p] = { lines: buildLines(o ? o.lines : []), locked: !!(o && o.locked), cutoff: o ? o.cutoff : "", dirty:false };
  });
  showBanner();
  render();
}

function qlen(){ return LS.get("om_queue", []).length; }
function showBanner(){
  const b = $("#banner"), msgs = [];
  if(S.offlineLoad) msgs.push("Mode offline: pesanan yang sudah tersimpan tidak bisa dimuat. Jika dikirim, pesanan periode yang Anda isi akan menggantikan pesanan sebelumnya.");
  if(qlen()) msgs.push(qlen() + " pesanan menunggu terkirim (otomatis saat sinyal kembali).");
  b.style.display = msgs.length ? "block" : "none"; b.textContent = msgs.join(" ");
}

/* ---------- Tampilan ---------- */
function render(){ renderTabs(); renderLines(); renderTotals(); }

function renderTabs(){
  $("#tabs").innerHTML = S.meta.periode.map(p => {
    const o = S.orders[p] || {};
    return `<button class="tab ${p === S.periode ? "on" : ""}" data-p="${esc(p)}">${esc(p)}${o.locked ? " 🔒" : ""}${o.dirty ? " •" : ""}</button>`;
  }).join("");
}

function renderLines(){
  const o = S.orders[S.periode], box = $("#lines");
  if(!o){ box.innerHTML = ""; return; }
  $("#cutoff").textContent = o.locked ? "Pemesanan periode ini sudah ditutup." : (o.cutoff ? "Batas pesan: " + o.cutoff + " WITA" : "");
  const dis = o.locked ? "disabled" : "";
  $("#addBox").classList.toggle("hide", o.locked);
  box.innerHTML = o.lines.map((l, i) => `
    <div class="line ${l.sub ? "" : "extra"}">
      <div class="lt"><b>${esc(l.titik)}</b><span>${esc(l.peruntukan)}</span>${l.sub || o.locked ? "" : `<button class="x" data-del="${i}">×</button>`}</div>
      <div class="qs">
        <label>Packmeal<input type="number" inputmode="numeric" min="0" max="999" data-i="${i}" data-f="packmeal" value="${l.packmeal || ""}" placeholder="0" ${dis}></label>
        <label>Canteen<input type="number" inputmode="numeric" min="0" max="999" data-i="${i}" data-f="canteen" value="${l.canteen || ""}" placeholder="0" ${dis}></label>
      </div>
      <input class="note" type="text" maxlength="200" placeholder="Catatan (opsional)" data-i="${i}" data-f="catatan" value="${esc(l.catatan)}" ${dis}>
    </div>`).join("") || '<p class="muted">Belum ada titik langganan. Tambahkan titik di bawah.</p>';
  $("#btnLast").disabled = o.locked; $("#btnClear").disabled = o.locked;
}

function sums(p){
  const o = S.orders[p]; let pm = 0, cn = 0;
  if(o) o.lines.forEach(l => { pm += num(l.packmeal); cn += num(l.canteen); });
  return { pm, cn };
}
function renderTotals(){
  const c = sums(S.periode); let ap = 0, ac = 0;
  S.meta.periode.forEach(p => { const s = sums(p); ap += s.pm; ac += s.cn; });
  $("#tot").innerHTML = `<b>${esc(S.periode)}</b>: ${c.pm} packmeal + ${c.cn} canteen = <b>${c.pm + c.cn}</b> porsi<br><span class="muted">Semua periode: ${ap} + ${ac} = ${ap + ac} porsi</span>`;
  const anyDirty = S.meta.periode.some(p => S.orders[p] && S.orders[p].dirty && !S.orders[p].locked);
  $("#btnSend").disabled = !anyDirty;
}

/* ---------- Event ---------- */
$("#btnLogin").onclick = async () => {
  $("#loginErr").textContent = "";
  const pin = $("#pin").value.trim();
  if(!/^\d{4,8}$/.test(pin)){ $("#loginErr").textContent = "PIN terdiri dari 4 sampai 8 angka."; return; }
  $("#btnLogin").disabled = true;
  if(await login(pin, false)) await enterApp();
  $("#btnLogin").disabled = false;
};
$("#pin").addEventListener("keydown", e => { if(e.key === "Enter") $("#btnLogin").click(); });
$("#btnOut").onclick = () => {
  if(!confirm("Keluar dari aplikasi?")) return;
  LS.del("om_pin"); LS.del("om_meta"); location.reload();
};
$("#nama").addEventListener("change", e => LS.set("om_nama", e.target.value.trim()));

function anyDirty(){ return S.meta.periode.some(p => S.orders[p] && S.orders[p].dirty); }
$("#tgl").addEventListener("change", async e => {
  if(anyDirty() && !confirm("Ada perubahan yang belum dikirim. Pindah tanggal dan buang perubahan?")){ e.target.value = S.tanggal; return; }
  S.tanggal = e.target.value; await loadDate();
});
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-p]"); if(!b) return;
  S.periode = b.dataset.p; render();
});
$("#lines").addEventListener("input", e => {
  const el = e.target, i = el.dataset.i, f = el.dataset.f; if(i == null) return;
  const o = S.orders[S.periode];
  o.lines[i][f] = f === "catatan" ? el.value : num(el.value);
  o.dirty = true; renderTabs(); renderTotals();
});
$("#lines").addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if(!b) return;
  const o = S.orders[S.periode]; o.lines.splice(+b.dataset.del, 1); o.dirty = true; render();
});
$("#btnAdd").onclick = () => {
  const titik = $("#addTitik").value, per = $("#addPer").value.trim();
  if(!titik) return toast("Pilih titik pengantaran.");
  if(!per) return toast("Isi peruntukan.");
  const o = S.orders[S.periode];
  o.lines.push({ titik, peruntukan:per, packmeal:0, canteen:0, catatan:"", sub:false });
  o.dirty = true; $("#addPer").value = ""; render();
  toast("Titik ditambahkan. Isi jumlahnya di daftar.");
};
$("#btnClear").onclick = () => {
  if(!confirm("Kosongkan semua angka pada periode " + S.periode + "?")) return;
  const o = S.orders[S.periode]; o.lines.forEach(l => { l.packmeal = 0; l.canteen = 0; }); o.dirty = true; render();
};
$("#btnLast").onclick = async () => {
  const o = S.orders[S.periode];
  if(o.lines.some(l => num(l.packmeal) + num(l.canteen) > 0) && !confirm("Angka yang sudah diisi akan diganti. Lanjut?")) return;
  try{
    const r = await call({ action:"last", pin:S.pin, periode:S.periode, tanggal:S.tanggal });
    if(!r.lines.length) return toast("Belum ada pesanan sebelumnya untuk periode " + S.periode + ".");
    o.lines = buildLines(r.lines); o.dirty = true; render();
    toast("Disalin dari pesanan tanggal " + r.tanggal + ". Periksa lalu kirim.");
  }catch(e){ toast(e.net ? "Perlu koneksi untuk menyalin pesanan terakhir." : e.message); }
};

/* ---------- Kirim & antrean offline ---------- */
function buildPayload(){
  const nama = $("#nama").value.trim();
  const orders = [];
  S.meta.periode.forEach(p => {
    const o = S.orders[p]; if(!o || !o.dirty || o.locked) return;
    orders.push({ periode:p, lines:o.lines.filter(l => num(l.packmeal) + num(l.canteen) > 0)
      .map(l => ({ titik:l.titik, peruntukan:l.peruntukan, packmeal:num(l.packmeal), canteen:num(l.canteen), catatan:l.catatan || "" })) });
  });
  return { action:"submit", pin:S.pin, tanggal:S.tanggal, nama, orders };
}

$("#btnSend").onclick = async () => {
  const nama = $("#nama").value.trim();
  if(!nama) return toast("Isi nama pemesan dulu.");
  LS.set("om_nama", nama);
  const payload = buildPayload();
  if(!payload.orders.length) return toast("Belum ada perubahan untuk dikirim.");
  const ringkas = payload.orders.map(o => {
    let pm = 0, cn = 0; o.lines.forEach(l => { pm += l.packmeal; cn += l.canteen; });
    return o.periode + ": " + pm + " packmeal, " + cn + " canteen" + (o.lines.length ? "" : " (pesanan dihapus)");
  }).join("\n");
  if(!confirm("Kirim pesanan untuk " + S.tanggal + "?\n\n" + ringkas)) return;
  $("#btnSend").disabled = true;
  try{
    const r = await call(payload);
    const bad = r.results.filter(x => !x.ok);
    r.results.filter(x => x.ok).forEach(x => { if(S.orders[x.periode]) S.orders[x.periode].dirty = false; });
    if(bad.length) toast("Sebagian gagal:\n" + bad.map(b => b.periode + ": " + b.error).join("\n"));
    else toast("Pesanan terkirim. Terima kasih.");
    const keep = {}; bad.forEach(b => { keep[b.periode] = S.orders[b.periode]; });
    await loadDate();
    Object.keys(keep).forEach(p => { S.orders[p] = keep[p]; }); render();
  }catch(e){
    if(e.net){
      const q = LS.get("om_queue", []); q.push({ id:Date.now(), payload }); LS.set("om_queue", q);
      payload.orders.forEach(o => { if(S.orders[o.periode]) S.orders[o.periode].dirty = false; });
      toast("Tidak ada sinyal. Pesanan disimpan di HP dan akan terkirim otomatis."); showBanner(); render();
    }else{ toast(e.message); renderTotals(); }
  }
};

let flushing = false;
async function flushQueue(){
  if(flushing || !qlen() || !S.pin) return;
  flushing = true;
  try{
    let q = LS.get("om_queue", []);
    while(q.length){
      const item = q[0];
      try{
        const r = await call(Object.assign({}, item.payload, { pin:S.pin }));
        const bad = r.results.filter(x => !x.ok);
        if(bad.length) toast("Pesanan tertunda gagal sebagian:\n" + bad.map(b => b.periode + ": " + b.error).join("\n"));
        else toast("Pesanan tertunda berhasil terkirim.");
        q.shift(); LS.set("om_queue", q);
      }catch(e){
        if(e.net) break;
        toast("Pesanan tertunda ditolak: " + e.message); q.shift(); LS.set("om_queue", q);
      }
    }
  } finally { flushing = false; showBanner(); }
  if(!qlen() && S.meta && !anyDirty()) loadDate();
}
window.addEventListener("online", flushQueue);

/* ---------- Mulai ---------- */
(async function init(){
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const pin = LS.get("om_pin", null);
  if(pin && await login(pin, true)) await enterApp();
})();
</script>
</body>
</html>
